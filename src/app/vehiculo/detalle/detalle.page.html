<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/vehiculo"
        icon="arrow-back"
        autoHide="false"
      ></ion-back-button>
    </ion-buttons>
    <ion-title>{{titulo}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <form [formGroup]="frmVehiculo">
        <ion-list lines="full">
          <ion-item>
            <ion-label position="stacked">Descripción</ion-label>
            <ion-input type="text" formControlName="descrip"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Tamaño</ion-label>
            <ion-select formControlName="idTamaño">
              <ion-select-option
                *ngFor="let tam of listaCatTamano"
                [value]="tam.idTamano"
              >
                {{ tam.tamano }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Capacidad</ion-label>
            <ion-input
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              formControlName="capacidad"
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Precio de renta</ion-label>
            <ion-input
              type="number"
              min="0"
              formControlName="pRenta"
              inputmode="decimal"
            ></ion-input>
          </ion-item>

          <ion-item lines="none" *ngIf="mostrarCheck">
            <ion-label>Estatus</ion-label>
            <ion-toggle formControlName="isEstado"></ion-toggle>
          </ion-item>
        </ion-list>

        <ion-button
          type="submit"
          expand="block"
          color="primary"
          class="ion-margin-top"
          [disabled]="frmVehiculo.invalid"
          (click)="guardar_editarVehiculo()"
        >
          {{ boton }}
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-loading
  [isOpen]="mostrarLoading"
  spinner="crescent"
  message="Procesando información..."
></ion-loading>
