<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Vehículo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Vehículo</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- LISTA DE VEHÍCULOS -->
  <ion-list>
    <ion-item *ngFor="let lst of listaVehiculos">
      <ion-label>
        <h2>{{ lst.vehiculo }}</h2>
        <p>
          {{ lst.tamano }} - {{ lst.capacidad }} • Renta: {{ lst.pRenta |
          currency:'MXN':'symbol':'1.2-2' }}
        </p>
      </ion-label>

      <!-- BADGE DE ESTATUS -->
      <ion-badge [color]="lst.isActivo ? 'success' : 'medium'">
        {{ lst.estatus }}
      </ion-badge>

      <!-- BOTÓN PARA MODIFICAR -->
      <ion-button
        color="primary"
        size="small"
        slot="end"
        (click)="editarVehiculo(lst)"
      >
        <!-- <ion-icon slot="start" name="pencil-outline"></ion-icon> -->
        Editar
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="crearVehiculo()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
